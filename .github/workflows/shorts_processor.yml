name: AI Shorts Processor

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  process-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Shorts Processing Script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python process_shorts.py

      - name: Upload Processed Short Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-transcribed-shorts
          path: output/ai_transcribed_shorts.mp4
